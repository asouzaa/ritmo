name: Construir e publicar ritmo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: front
        run: npm ci

      - name: Construir frontend
        working-directory: front
        env:
          VITE_API_URL: https://script.google.com/macros/s/AKfycbyok8aRiQtXxyg3jGUxTvREgV7X-Vdr5fSFmfUByKOt5CmXNAzOoaYPyaZJQyPIRvuR/exec
        run: npm run build

      - name: Preparar arquivos do Pages
        run: cp -R front/dist/. docs/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Criar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
